<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Telemetry Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  </head>
  <body>

    <header class="container">
      
      <section>
        <nav>
          <ul>
            <li>
              <img src="/images/logo.svg" alt="FRUCD Logo" style="height:55px; width:auto;">
            </li>
          </ul>
          <ul>
            <li><a href="/" class="secondary">Graphs</a></li>
            <li><a href="/camera" class="secondary">Camera</a></li>
            <li><button id="logCanData" value="false" class="outline" style="white-space: nowrap; width: fit-content;">Log CAN</button></li>
            <li><button class="outline" style="white-space: nowrap; width: fit-content;">Record Camera</button></li>
          </ul>
        </nav>
      </section>

      {% block dropdown %}{% endblock dropdown %}

    </header>

    <main class="container">
      {% block graph %}
      {% endblock graph %}

      {% block cameraFeed %}
      {% endblock cameraFeed %}
    </main>

    <script type="module" src="{{ url_for('static', path='app.js') }}" defer></script>
    {% block scripts %}
    {% endblock scripts %}
    
  </body>
</html>
