<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Telemetry Dashboard</title>
  </head>
  <body>

    <header class="container">
      
      <section>
        <nav>
          <ul>
            <li><strong>FORMULA RACING AT UC DAVIS</strong></li>
          </ul>
          <ul>
            <li><a href="#" class="secondary">Graphs</a></li>
            <li><a href="#" class="secondary">Camera</a></li>
            <li><a href="#" class="secondary">Install Data Grapher</a></li>
            <li><button class="outline">Log CAN Data</button></li>
            <li><button class="outline">Record Camera Stream</button></li>
          </ul>
        </nav>
      </section>

      <details class="dropdown">
        <summary>
          Export CSV...
        </summary>
        <ul>
          <li>
            <label>
              <input type="checkbox" name="solid" />
              20251010_193149.csv
            </label>
          </li>
          <li>
            <li><a href="#">Download</a></li>
          </li>
        </ul>
      </details>

    </header>

    <main class="container">

      <article data-theme="light">
        <div class="grid">
          <div>
            <table class="striped">
              <thead>
                <tr>
                  <th scope="col">Source</th>
                  <th scope="col">State</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <th scope="row">VCU</th>
                  <td>No Data</td>
                </tr>
                <tr>
                  <th scope="row">PEI</th>
                  <td>No Data</td>
                </tr>
                <tr>
                  <th scope="row">MC</th>
                  <td>No Data</td>
                </tr>
              </tbody>
              <tfoot>
              </tfoot>
            </table>
          </div>
          <div>
            <canvas id="barChart"></canvas>
          </div>
        </div>
      </article>

      <article data-theme="light">
        <details class="dropdown">
          <summary>Select Data...</summary>
          <ul>
            <li>
              <label>
                <input type="radio" name="phase" value="speed" />
                Motor Speed
              </label>
            </li>
            <li>
              <label>
                <input type="radio" name="phase" value="current" />
                Current
              </label>
            </li>
            <li>
              <label>
                <input type="radio" name="phase" value="soc" />
                State of Charge
              </label>
            </li>
          </ul>
        </details>

        <canvas id="lineChart"></canvas>
      </article>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
